<main class="login-page">
	<section class="login-card" aria-labelledby="login-title">
		<div class="login-header">
			<div class="icon-circle">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
					<polyline points="10 17 15 12 10 7"></polyline>
					<line x1="15" y1="12" x2="3" y2="12"></line>
				</svg>
			</div>
			<h1 id="login-title">Sign In</h1>
			<p class="subtitle">Welcome back!</p>
		</div>

		@if (serverError) {
			<div class="error-banner">
				{{ serverError }}
			</div>
		}

		<form (ngSubmit)="onSubmit()">
			<div class="form-group">
				<label for="username">Email</label>
				<div class="input-wrapper">
					<input
						id="username"
						name="username"
						type="text"
						[(ngModel)]="username"
						placeholder="Enter your email"
						autocomplete="username"
						required
					/>
				</div>
			</div>

			<div class="form-group">
				<div class="label-row">
					<label for="password">Password</label>
				</div>
				<div class="input-wrapper">
					<input
						id="password"
						name="password"
						[type]="showPassword ? 'text' : 'password'"
						[(ngModel)]="password"
						placeholder="Enter your password"
						autocomplete="current-password"
						required
					/>
					<button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
						@if (showPassword) {
							<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
						} @else {
							<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
						}
					</button>
				</div>
			</div>

			<button type="submit" class="login-btn">Log In</button>
		</form>

		<p class="registration-link">
			Don't have an account? <a href="#" (click)="switchToRegister($event)">Register here</a>
		</p>
        <a class="forgot-password" href="#" (click)="switchToForgotPassword($event)">Forgot password?</a>
	</section>
</main>
