<main class="login-page">
	<section class="login-card" aria-labelledby="login-title">
		<div class="login-header">
			<h1 id="login-title">Forgot Password</h1>
			<p class="subtitle">Enter your email to receive a reset link</p>
		</div>

		@if (serverError) {
			<div class="error-banner">
				{{ serverError }}
			</div>
		}
        @if (message) {
			<div class="success-banner" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 1rem;">
				{{ message }}
			</div>
		}

		<form (ngSubmit)="onSubmit()">
			<div class="form-group">
				<label for="email">Email</label>
				<div class="input-wrapper">
					<input
						id="email"
						name="email"
						type="email"
						[(ngModel)]="email"
						placeholder="Enter your email"
						required
					/>
				</div>
			</div>

			<button type="submit" class="login-btn">
				<span>Send Reset Link</span>
			</button>
		</form>

		<p class="registration-link">
			Remember your password? <a href="#" (click)="switchToLogin($event)">Log In</a>
		</p>
	</section>
</main>
