<main class="register-page">
	<section class="register-card" aria-labelledby="register-title">
		<div class="register-header">
			<div class="icon-circle">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
					<circle cx="8.5" cy="7" r="4"></circle>
					<line x1="20" y1="8" x2="20" y2="14"></line>
					<line x1="23" y1="11" x2="17" y2="11"></line>
				</svg>
			</div>
			<h1 id="register-title">Create Account</h1>
			<p class="subtitle">Join us today! Enter your details to get started.</p>
		</div>

		@if (errorMessage || serverError) {
			<div class="error-banner">
				{{ errorMessage || serverError }}
			</div>
		}

		<form (ngSubmit)="onSubmit()">
			<div class="form-group">
				<label for="reg-email">Email Address</label>
				<div class="input-wrapper">
					<input
						id="reg-email"
						name="email"
						type="email"
						[(ngModel)]="email"
						placeholder="user@example.com"
						autocomplete="email"
						required
					/>
				</div>
			</div>

			<div class="form-group">
				<label for="reg-password">Password</label>
				<div class="input-wrapper">
					<input
						id="reg-password"
						name="password"
						[type]="showPassword ? 'text' : 'password'"
						[(ngModel)]="password"
						placeholder="Create a strong password"
						autocomplete="new-password"
						required
					/>
					<button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
						@if (showPassword) {
							<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
						} @else {
							<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
						}
					</button>
				</div>
			</div>

			<div class="form-group">
				<label for="confirmPassword">Confirm Password</label>
				<div class="input-wrapper">
					<input
						id="confirmPassword"
						name="confirmPassword"
						[type]="showConfirmPassword ? 'text' : 'password'"
						[(ngModel)]="confirmPassword"
						placeholder="Confirm your password"
						autocomplete="new-password"
						required
					/>
					<button type="button" class="password-toggle-btn" (click)="toggleConfirmPasswordVisibility()" aria-label="Toggle password visibility">
						@if (showConfirmPassword) {
							<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
						} @else {
							<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
						}
					</button>
				</div>
			</div>

			<button type="submit" class="register-btn">Sign Up</button>
		</form>

		<p class="login-link">
			Already have an account? <a href="#" (click)="switchToLogin($event)">Sign In here</a>
		</p>
	</section>
</main>
