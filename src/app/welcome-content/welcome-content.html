<div class="welcome-dashboard">
  <div class="welcome-card">
    <div class="welcome-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h2 class="welcome-title">Authentication Successful</h2>
    @if (userName) {
      <p class="welcome-subtitle">Welcome to your secure dashboard area, {{ userName }}!</p>
    } @else {
      <p class="welcome-subtitle">Welcome to your secure dashboard area.</p>
    }
    
    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-value">Active</span>
        <span class="stat-label">Status</span>
      </div>
      <div class="stat-box">
        <span class="stat-value">Secured</span>
        <span class="stat-label">Connection</span>
      </div>
    </div>
    
    
    <!-- TEMPORARILY DISABLED MFA
    <button class="action-btn" *ngIf="mfaSetupStep === 'none'" (click)="startMfaSetup()">Enable Two-Factor Authentication</button>
    
    <div *ngIf="mfaSetupStep === 'qr'" class="mfa-setup-section" style="margin-top: 20px; padding: 20px; background: #f9fafb; border-radius: 8px;">
      <h3 style="font-weight: 600; color: #111827; margin-bottom: 10px;">Setup Two-Factor Authentication</h3>
      <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 15px;">Scan this QR code with the Google Authenticator app, then enter the 6-digit code below to verify.</p>
      
      <div style="display: flex; justify-content: center; margin-bottom: 15px;">
        <img [src]="mfaQrUrl" alt="MFA QR Code" style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; background: white;" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <input type="text" [(ngModel)]="mfaCode" placeholder="Enter 6-digit code" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; width: 100%; box-sizing: border-box;" />
        <button (click)="verifyMfaSetup()" style="padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: 500; cursor: pointer;">Verify & Enable</button>
      </div>
      
      <p *ngIf="mfaMessage" style="color: #ef4444; font-size: 0.875rem; margin-top: 10px;">{{ mfaMessage }}</p>
    </div>

    <div *ngIf="mfaSetupStep === 'success'" class="mfa-setup-section" style="margin-top: 20px; padding: 20px; background: #d1fae5; border-radius: 8px;">
      <h3 style="font-weight: 600; color: #065f46; margin-bottom: 10px;">MFA Enabled</h3>
      <p style="color: #047857; font-size: 0.9rem;">{{ mfaMessage }}</p>
    </div>

    <div *ngIf="mfaSetupStep === 'error'" class="mfa-setup-section" style="margin-top: 20px; padding: 20px; background: #fee2e2; border-radius: 8px;">
      <h3 style="font-weight: 600; color: #991b1b; margin-bottom: 10px;">Error</h3>
      <p style="color: #b91c1c; font-size: 0.9rem;">{{ mfaMessage }}</p>
      <button (click)="startMfaSetup()" style="margin-top: 10px; padding: 8px 16px; background: white; color: #b91c1c; border: 1px solid #f87171; border-radius: 6px; cursor: pointer;">Try Again</button>
    </div>
    -->

  </div>
</div>
