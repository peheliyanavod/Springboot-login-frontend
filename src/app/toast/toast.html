<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
  <div *ngFor="let toast of toastService.toasts()" 
       class="toast-item pointer-events-auto flex items-center p-4 w-full max-w-xs rounded-lg shadow-lg"
       [ngClass]="{
         'bg-green-100 text-green-800 dark:bg-green-800 dark:text-green-100': toast.type === 'success',
         'bg-red-100 text-red-800 dark:bg-red-800 dark:text-red-100': toast.type === 'error',
         'bg-blue-100 text-blue-800 dark:bg-blue-800 dark:text-blue-100': toast.type === 'info'
       }"
       role="alert">
    
    <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
         [ngClass]="{
           'bg-green-200 text-green-900 dark:bg-green-900 dark:text-green-200': toast.type === 'success',
           'bg-red-200 text-red-900 dark:bg-red-900 dark:text-red-200': toast.type === 'error',
           'bg-blue-200 text-blue-900 dark:bg-blue-900 dark:text-blue-200': toast.type === 'info'
         }">
      <!-- Success Icon -->
      <svg *ngIf="toast.type === 'success'" class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
      </svg>
      <!-- Error Icon -->
      <svg *ngIf="toast.type === 'error'" class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/>
      </svg>
      <!-- Info Icon -->
      <svg *ngIf="toast.type === 'info'" class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
      </svg>
    </div>
    
    <div class="ml-3 text-sm font-normal break-words pr-2">
      {{ toast.message }}
    </div>
    
    <button type="button" 
            class="ml-auto -mx-1.5 -my-1.5 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 inline-flex h-8 w-8 text-gray-500 hover:text-gray-900 bg-white hover:bg-gray-100 dark:text-gray-400 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700 transition-colors" 
            (click)="removeToast(toast.id)"
            aria-label="Close">
      <span class="sr-only">Close</span>
      <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
      </svg>
    </button>
  </div>
</div>
