<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-item"
         [ngClass]="{
           'toast-success': toast.type === 'success',
           'toast-error': toast.type === 'error',
           'toast-info': toast.type === 'info'
         }"
         role="alert">
      
      <div class="toast-icon-container"
           [ngClass]="{
             'toast-success-icon-bg': toast.type === 'success',
             'toast-error-icon-bg': toast.type === 'error',
             'toast-info-icon-bg': toast.type === 'info'
           }">
        <!-- Success Icon -->
        <svg *ngIf="toast.type === 'success'" class="toast-icon" width="20" height="20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
        </svg>
        <!-- Error Icon -->
        <svg *ngIf="toast.type === 'error'" class="toast-icon" width="20" height="20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/>
        </svg>
        <!-- Info Icon -->
        <svg *ngIf="toast.type === 'info'" class="toast-icon" width="20" height="20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
        </svg>
      </div>
      
      <div class="toast-message">
        {{ toast.message }}
        <span *ngIf="toast.remainingSeconds" style="display: block; font-size: 0.75rem; margin-top: 0.25rem; opacity: 0.8; font-weight: 500;">
          Closing in {{ toast.remainingSeconds }}...
        </span>
      </div>
      
      <button type="button" 
              class="toast-close-btn" 
              (click)="removeToast(toast.id)"
              aria-label="Close">
        <span class="sr-only">Close</span>
        <svg class="toast-close-icon" width="12" height="12" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
      </button>
    </div>
  }
</div>
